<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>매매 체크리스트</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --panel-2: #232730;
    --text: #e6e8eb;
    --muted: #8a8f99;
    --border: #2a2f3a;
    --accent: #4f8cff;
    --z: #6ea8ff;
    --x: #a78bfa;
    --action: #4f8cff;
    --modifier: #f5c542;
    --entry-q: #b8b8b8;
    --hold-r: #ff6b6b;
    --observe: #5dd39e;
    --enter: #4f8cff;
    --suspend: #ff8c42;
    --danger: #ff4d4d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", Roboto, sans-serif;
    font-size: 15px;
    overscroll-behavior: none;
    user-select: none;
  }
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header {
    padding: 10px 16px; background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    flex-shrink: 0;
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  .icon-btn {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 7px 11px; border-radius: 9px; font-size: 13px; cursor: pointer;
  }
  .icon-btn.danger { color: var(--danger); }

  /* Main split */
  main {
    flex: 1; display: flex; min-height: 0; overflow: hidden;
  }
  .tree-panel, .tag-panel {
    overflow-y: auto;
    padding: 10px;
  }
  .tree-panel {
    flex: 1; min-width: 0;
    background: var(--bg);
    border-right: 1px solid var(--border);
  }
  .tag-panel {
    flex: 1; min-width: 0;
    background: var(--panel);
  }
  .section-title {
    font-size: 10px; color: var(--muted);
    margin: 4px 0 6px; letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .kind-row { margin-bottom: 8px; }
  .kind-row .kind-label {
    font-size: 10px; color: var(--muted); font-weight: 600;
    margin-bottom: 4px; letter-spacing: 0.5px;
  }
  .kind-row .kind-label.k-z      { color: var(--z); }
  .kind-row .kind-label.k-x      { color: var(--x); }
  .kind-row .kind-label.k-modifier{ color: var(--modifier); }
  .kind-row .kind-label.k-action { color: var(--action); }
  .kind-row .kind-label.k-entry_q{ color: var(--entry-q); }
  .kind-row .kind-label.k-hold_r { color: var(--hold-r); }

  .chip-strip {
    display: flex; gap: 5px; overflow-x: auto;
    scrollbar-width: none; padding-bottom: 2px;
    -webkit-overflow-scrolling: touch;
  }
  .chip-strip::-webkit-scrollbar { display: none; }

  .chip {
    padding: 6px 10px; border-radius: 999px; border: 1.5px solid var(--border);
    background: var(--panel-2); color: var(--text); font-size: 12.5px;
    cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    white-space: nowrap; flex-shrink: 0;
  }
  .chip.k-z        { border-color: var(--z); }
  .chip.k-x        { border-color: var(--x); }
  .chip.k-modifier { border-color: var(--modifier); }
  .chip.k-action   { border-color: var(--action); }
  .chip.k-entry_q  { border-color: var(--entry-q); }
  .chip.k-hold_r   { border-color: var(--hold-r); }
  .chip.selected.k-z        { background: var(--z); color: #1a1d24; }
  .chip.selected.k-x        { background: var(--x); color: white; }
  .chip.selected.k-modifier { background: var(--modifier); color: #1a1d24; }
  .chip.selected.k-action   { background: var(--action); color: white; }
  .chip.selected.k-entry_q  { background: var(--entry-q); color: #1a1d24; }
  .chip.selected.k-hold_r   { background: var(--hold-r); color: white; }
  .chip .x { display: none; font-weight: bold; opacity: 0.9; font-size: 13px; }
  .chip.selected .x { display: inline; }
  .chip.add { border-style: dashed; color: var(--muted); }

  .confidence-row { display: flex; gap: 6px; }
  .dot {
    width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--border);
    background: var(--panel-2); display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-weight: 600; cursor: pointer; font-size: 13px;
    flex-shrink: 0;
  }
  .dot.selected { background: var(--accent); color: white; border-color: var(--accent); }

  /* Tree */
  .draft-tree, .feed-item {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12.5px; line-height: 1.6;
    background: var(--panel-2); padding: 10px;
    border-radius: 10px; border-left: 4px solid var(--border);
    margin-bottom: 6px; white-space: pre-wrap;
  }
  .draft-tree {
    border-left-color: var(--accent);
    min-height: 50px;
  }
  .draft-tree.empty { color: var(--muted); font-family: inherit; }
  .feed-item.m-enter   { border-left-color: var(--enter); }
  .feed-item.m-suspend { border-left-color: var(--suspend); }
  .feed-item.m-observe { border-left-color: var(--observe); }
  .feed-item .del {
    float: right; color: var(--muted); font-size: 10px; cursor: pointer;
    padding: 1px 6px; border: 1px solid var(--border); border-radius: 5px;
    font-family: inherit;
  }
  .tree-tag {
    cursor: pointer; padding: 1px 4px; border-radius: 4px;
    transition: background 0.1s;
  }
  .tree-tag:active { background: var(--danger); color: white; }

  /* Memo + action bar */
  .memo-bar {
    padding: 8px 12px; background: var(--panel); border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  textarea {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px;
    font-size: 13px; resize: none; font-family: inherit;
  }
  .action-bar {
    padding: 8px 12px; background: var(--bg); border-top: 1px solid var(--border);
    display: grid; grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 6px; flex-shrink: 0;
  }
  .btn {
    padding: 14px 8px; border-radius: 10px; border: none; cursor: pointer;
    font-size: 14px; font-weight: 600;
  }
  .btn.primary { background: var(--accent); color: white; }
  .btn.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  .btn.danger { background: var(--panel-2); color: var(--danger); border: 1px solid var(--danger); }

  /* Modal */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100;
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--panel); border-radius: 14px; padding: 16px;
    width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
  }
  .modal h2 { margin: 0 0 12px; font-size: 15px; }
  .tag-row {
    display: flex; align-items: center; gap: 6px;
    padding: 6px; background: var(--panel-2); border-radius: 7px; margin-bottom: 4px;
  }
  .tag-row input[type="text"] {
    flex: 1; background: transparent; color: var(--text); border: none; font-size: 13px;
    padding: 3px;
  }
  .tag-row select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    padding: 3px 5px; border-radius: 5px; font-size: 11px;
  }
  .toast {
    position: fixed; bottom: 140px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); color: var(--text); padding: 9px 16px;
    border-radius: 999px; border: 1px solid var(--border); font-size: 12.5px;
    opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 200;
  }
  .toast.show { opacity: 1; }
  .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 8px; }

  /* portrait iPad fallback */
  @media (max-width: 700px) {
    main { flex-direction: column; }
    .tree-panel { border-right: none; border-bottom: 1px solid var(--border); max-height: 40vh; }
  }
</style>
</head>
<body>

<header>
  <h1>매매 체크리스트 <span style="color:var(--muted);font-size:11px;font-weight:400">v1</span></h1>
  <button class="icon-btn" id="manageBtn">⚙ 태그</button>
</header>

<main>
  <!-- 좌: 트리 패널 -->
  <div class="tree-panel">
    <div class="section-title">지금 입력 중 <span style="text-transform:none;color:var(--muted)">(태그 탭 = 제거)</span></div>
    <div id="currentTree" class="draft-tree empty">아직 선택 없음</div>

    <div class="section-title" style="margin-top:12px">최근 활동</div>
    <div id="recentFeed"></div>
  </div>

  <!-- 우: 태그 패널 -->
  <div class="tag-panel" id="tagPanel"></div>
</main>

<div class="memo-bar">
  <textarea id="memoInput" rows="1" placeholder="메모 (선택, 음성 입력 가능)"></textarea>
</div>

<div class="action-bar">
  <button class="btn primary" id="commitBtn">기록</button>
  <button class="btn ghost" id="undoBtn">↶ 마지막</button>
  <button class="btn danger" id="resetBtn">🗑 전체</button>
  <button class="btn ghost" id="exportBtn">⇩ CSV</button>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h2>태그 관리</h2>
    <div id="tagList"></div>
    <div style="margin-top:12px;display:flex;gap:8px;">
      <button class="btn primary" id="addTagBtn">+ 추가</button>
      <button class="btn ghost" id="closeModalBtn">닫기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==============================
// 상태
// ==============================
const STORAGE_KEY = "checklist_v1";
const TAG_KEY = "checklist_tags_v1";

const KINDS = {
  z:        { label: "Z (1500T 컨텍스트, 멀티)", multi: true,  layer: 1 },
  x:        { label: "X (200T 트리거, 멀티)",    multi: true,  layer: 2 },
  action:   { label: "행동 (단일)",               multi: false, layer: 3 },
  modifier: { label: "시장 질감 (자유, 멀티)",    multi: true,  layer: 99 },
  entry_q:  { label: "진입 품질 (ENTRY 시)",      multi: true,  layer: 99 },
  hold_r:   { label: "보류 사유 (HOLD 시)",        multi: true,  layer: 99 },
};

const SEED_TAGS = [
  // Z 층
  { id: "z1", name: "Z_DIR(-1)",   kind: "z", active: true },
  { id: "z2", name: "Z_DIR(0)",    kind: "z", active: true },
  { id: "z3", name: "Z_DIR(1)",    kind: "z", active: true },
  { id: "z4", name: "Z_PHASE(1>3)", kind: "z", active: true },
  { id: "z5", name: "Z_IRE ROPE EXT", kind: "z", active: true },
  // X 층
  { id: "x1", name: "X_IPE",        kind: "x", active: true },
  { id: "x2", name: "X_phase(4>3)", kind: "x", active: true },
  // 행동
  { id: "a1", name: "ENTRY",   kind: "action", active: true },
  { id: "a2", name: "HOLD",    kind: "action", active: true },
  { id: "a3", name: "OBSERVE", kind: "action", active: true },
  // 시장 질감
  { id: "m1", name: "STRONG",  kind: "modifier", active: true },
  { id: "m2", name: "WEAK",    kind: "modifier", active: true },
  { id: "m3", name: "CHOPPY",  kind: "modifier", active: true },
  { id: "m4", name: "RANGY",   kind: "modifier", active: true },
  { id: "m5", name: "TRENDY",  kind: "modifier", active: true },
  { id: "m6", name: "FAST",    kind: "modifier", active: true },
  { id: "m7", name: "SLOW",    kind: "modifier", active: true },
  // 진입 품질
  { id: "q1", name: "RATE",      kind: "entry_q", active: true },
  { id: "q2", name: "Premature", kind: "entry_q", active: true },
  { id: "q3", name: "Late",      kind: "entry_q", active: true },
  { id: "q4", name: "Moderate",  kind: "entry_q", active: true },
  { id: "q5", name: "Impatient", kind: "entry_q", active: true },
  { id: "q6", name: "Hasty",     kind: "entry_q", active: true },
  { id: "q7", name: "Rash",      kind: "entry_q", active: true },
  // 보류 사유
  { id: "h1", name: "직전 CHOPPY", kind: "hold_r", active: true },
  { id: "h2", name: "사이즈 부담", kind: "hold_r", active: true },
  { id: "h3", name: "확신 부족",   kind: "hold_r", active: true },
];

function loadTags() {
  const raw = localStorage.getItem(TAG_KEY);
  if (!raw) { localStorage.setItem(TAG_KEY, JSON.stringify(SEED_TAGS)); return [...SEED_TAGS]; }
  return JSON.parse(raw);
}
function saveTags(arr) { localStorage.setItem(TAG_KEY, JSON.stringify(arr)); }
function loadEvents() { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : []; }
function saveEvents(arr) { localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); }

let tags = loadTags();
let events = loadEvents();
let draft = newDraft();
let confidence = null;

function newDraft() {
  const obj = { tap_order: [], tap_times: [], startedAt: new Date().toISOString() };
  for (const k of Object.keys(KINDS)) obj[k] = [];
  return obj;
}

// ==============================
// 유틸
// ==============================
function uid(p="e") { return p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function now() { return new Date(); }
function fmtTime(d) { return new Date(d).toTimeString().slice(0,8); }
function fmtDate(d) { return new Date(d).toISOString().slice(0,10); }
function tagById(id) { return tags.find(t => t.id === id); }
function tagsByKind(kind) { return tags.filter(t => t.kind === kind && t.active); }
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1500);
}

// ==============================
// 렌더 — 우측 태그 패널
// ==============================
const tagPanel = document.getElementById("tagPanel");

function renderTagPanel() {
  let html = "";
  for (const [kind, info] of Object.entries(KINDS)) {
    html += `
      <div class="kind-row">
        <div class="kind-label k-${kind}">${info.label}</div>
        <div class="chip-strip" data-kind="${kind}">
          ${tagsByKind(kind).map(t => chipHTML(t)).join("")}
          <span class="chip add" data-add="${kind}">+ 새로</span>
        </div>
      </div>
    `;
  }
  // 확신도
  html += `
    <div class="kind-row">
      <div class="kind-label" style="color:var(--accent)">확신도 (ENTRY 시)</div>
      <div class="confidence-row">
        ${[1,2,3,4,5].map(n => `<div class="dot ${confidence===n?'selected':''}" data-c="${n}">${n}</div>`).join("")}
      </div>
    </div>
  `;
  tagPanel.innerHTML = html;

  tagPanel.querySelectorAll(".chip").forEach(el => {
    if (el.dataset.add) {
      el.onclick = () => addTagInline(el.dataset.add);
    } else if (el.dataset.tagid) {
      el.onclick = () => toggleChip(el.dataset.tagid, el.dataset.kind);
    }
  });
  tagPanel.querySelectorAll(".dot").forEach(d => {
    d.onclick = () => {
      const n = parseInt(d.dataset.c);
      confidence = (confidence === n) ? null : n;
      renderAll();
    };
  });
}

function chipHTML(t) {
  const isSel = draft[t.kind].includes(t.id);
  return `<span class="chip k-${t.kind} ${isSel?'selected':''}" data-tagid="${t.id}" data-kind="${t.kind}">${t.name}<span class="x">×</span></span>`;
}

function toggleChip(tagId, kind) {
  const arr = draft[kind];
  const idx = arr.indexOf(tagId);
  const single = !KINDS[kind].multi;

  if (idx >= 0) {
    arr.splice(idx, 1);
    const oi = draft.tap_order.indexOf(tagId);
    if (oi >= 0) draft.tap_order.splice(oi, 1);
  } else {
    if (single) arr.length = 0;
    arr.push(tagId);
    draft.tap_order.push(tagId);
    draft.tap_times.push({ tagId, ts: now().toISOString() });
  }
  renderAll();
}

function addTagInline(kind) {
  const name = prompt(`새 ${KINDS[kind].label} 이름:`);
  if (!name || !name.trim()) return;
  const t = { id: uid("t"), name: name.trim(), kind, active: true };
  tags.push(t); saveTags(tags);
  draft[kind].push(t.id);
  draft.tap_order.push(t.id);
  draft.tap_times.push({ tagId: t.id, ts: now().toISOString() });
  renderAll();
  toast(`태그 추가: ${name}`);
}

// ==============================
// 렌더 — 트리 (현재 draft + 최근 활동)
// ==============================
const treeEl = document.getElementById("currentTree");
const feedEl = document.getElementById("recentFeed");

function renderCurrentTree() {
  const hasAny = Object.values(draft).some(v => Array.isArray(v) && v.length > 0) || confidence != null;
  if (!hasAny) {
    treeEl.className = "draft-tree empty";
    treeEl.innerHTML = "아직 선택 없음";
    return;
  }
  treeEl.className = "draft-tree";
  treeEl.innerHTML = draftToTree();

  // 트리 안 태그 탭하면 그 태그 제거
  treeEl.querySelectorAll(".tree-tag").forEach(el => {
    el.onclick = () => {
      const tagId = el.dataset.tagid;
      const t = tagById(tagId);
      if (!t) return;
      const arr = draft[t.kind];
      const i = arr.indexOf(tagId);
      if (i >= 0) arr.splice(i, 1);
      const oi = draft.tap_order.indexOf(tagId);
      if (oi >= 0) draft.tap_order.splice(oi, 1);
      renderAll();
    };
  });
  treeEl.querySelectorAll(".tree-conf").forEach(el => {
    el.onclick = () => { confidence = null; renderAll(); };
  });
}

function draftToTree() {
  const zs = draft.z.map(id => tagById(id)?.name).filter(Boolean);
  const xs = draft.x.map(id => tagById(id)?.name).filter(Boolean);
  const ax = draft.action[0] ? tagById(draft.action[0])?.name : null;
  const mods = draft.modifier.map(id => tagById(id)?.name).filter(Boolean);
  const equ = draft.entry_q.map(id => tagById(id)?.name).filter(Boolean);
  const hol = draft.hold_r.map(id => tagById(id)?.name).filter(Boolean);

  // 태그를 인라인 인터랙티브로
  const zTags = draft.z.map(id => `<span class="tree-tag" data-tagid="${id}">${tagById(id)?.name||"?"}</span>`).join(" · ");
  const xTags = draft.x.map(id => `<span class="tree-tag" data-tagid="${id}">${tagById(id)?.name||"?"}</span>`).join(" · ");
  const actTag = draft.action[0] ? `<span class="tree-tag" data-tagid="${draft.action[0]}">${ax}</span>` : "";
  const modTags = draft.modifier.map(id => `<span class="tree-tag" data-tagid="${id}">${tagById(id)?.name||"?"}</span>`).join("  · ");
  const equTags = draft.entry_q.map(id => `<span class="tree-tag" data-tagid="${id}">${tagById(id)?.name||"?"}</span>`).join("  · ");
  const holTags = draft.hold_r.map(id => `<span class="tree-tag" data-tagid="${id}">${tagById(id)?.name||"?"}</span>`).join("  · ");

  let out = "";
  let indent = 0;
  if (zs.length) { out += `Z: ${zTags}\n`; indent = 1; }
  if (xs.length) { out += `${"  ".repeat(indent)}└ X: ${xTags}\n`; indent++; }
  if (ax) {
    if (indent === 0) { out += `${actTag}\n`; indent = 1; }
    else { out += `${"  ".repeat(indent)}└ ${actTag}\n`; }
  }
  // 메타 줄: modifier / entry_q / hold_r / 확신도
  const meta = [];
  if (modTags) meta.push(modTags);
  if (equTags) meta.push(equTags);
  if (holTags) meta.push(`보류사유: ${holTags}`);
  if (confidence != null) meta.push(`<span class="tree-conf" style="cursor:pointer;text-decoration:underline dotted">확신도 ${confidence}</span>`);
  if (meta.length) out += `${"  ".repeat(Math.max(indent,1))}· ${meta.join("  · ")}\n`;

  return out.trimEnd();
}

function renderFeed() {
  if (events.length === 0) {
    feedEl.innerHTML = `<div class="empty">아직 기록 없음</div>`;
    return;
  }
  const recent = events.slice(-8).reverse();
  feedEl.innerHTML = recent.map(eventToFeedItem).join("");
  feedEl.querySelectorAll(".del").forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.dataset.id;
      if (confirm("이 기록 삭제?")) {
        events = events.filter(x => x.id !== id);
        saveEvents(events); renderFeed();
      }
    };
  });
}

function eventToFeedItem(ev) {
  const zs = ev.z.map(id => tagById(id)?.name).filter(Boolean);
  const xs = ev.x.map(id => tagById(id)?.name).filter(Boolean);
  const ax = ev.action[0] ? (tagById(ev.action[0])?.name || "") : "";
  const mods = ev.modifier.map(id => tagById(id)?.name).filter(Boolean);
  const equ = ev.entry_q.map(id => tagById(id)?.name).filter(Boolean);
  const hol = ev.hold_r.map(id => tagById(id)?.name).filter(Boolean);

  let body = `[${fmtTime(ev.ts)}] ${ax || "(no-action)"}`;
  body += `<span class="del" data-id="${ev.id}">×</span>\n`;
  let indent = 0;
  if (zs.length) { body += `Z: ${zs.join(" · ")}\n`; indent = 1; }
  if (xs.length) { body += `${"  ".repeat(indent)}└ X: ${xs.join(" · ")}\n`; indent++; }
  if (ax && (zs.length || xs.length)) body += `${"  ".repeat(indent)}└ ${ax}\n`;
  const meta = [];
  if (mods.length) meta.push(mods.join("  · "));
  if (equ.length) meta.push(equ.join("  · "));
  if (hol.length) meta.push(`보류사유: ${hol.join("  · ")}`);
  if (ev.confidence != null) meta.push(`확신도 ${ev.confidence}`);
  if (meta.length) body += `${"  ".repeat(Math.max(indent,1))}· ${meta.join("  · ")}\n`;
  if (ev.memo) body += `${"  ".repeat(Math.max(indent,1))}메모: ${ev.memo}\n`;

  const cls = ax === "ENTRY" ? "m-enter" : ax === "HOLD" ? "m-suspend" : "m-observe";
  return `<div class="feed-item ${cls}">${body.trimEnd()}</div>`;
}

// ==============================
// 메인 렌더
// ==============================
function renderAll() {
  renderTagPanel();
  renderCurrentTree();
  renderFeed();
}

// ==============================
// 기록 / 취소 / 초기화 / 내보내기
// ==============================
document.getElementById("commitBtn").onclick = () => {
  const memo = document.getElementById("memoInput").value;
  const anyTag = Object.keys(KINDS).some(k => draft[k].length > 0);
  if (!anyTag && !memo.trim() && confidence == null) {
    toast("태그 또는 메모 하나는 필요");
    return;
  }
  const event = {
    id: uid("e"),
    ts: now().toISOString(),
    z: [...draft.z],
    x: [...draft.x],
    action: [...draft.action],
    modifier: [...draft.modifier],
    entry_q: [...draft.entry_q],
    hold_r: [...draft.hold_r],
    tap_order: [...draft.tap_order],
    tap_times: [...draft.tap_times],
    confidence,
    memo,
    startedAt: draft.startedAt,
  };
  events.push(event);
  saveEvents(events);
  toast("기록됨");
  draft = newDraft();
  confidence = null;
  document.getElementById("memoInput").value = "";
  renderAll();
};

document.getElementById("undoBtn").onclick = () => {
  // draft 안에서 마지막 액션부터 되돌림
  const memoEl = document.getElementById("memoInput");
  if (draft.tap_order.length > 0) {
    const lastId = draft.tap_order.pop();
    draft.tap_times = draft.tap_times.filter(t => t.tagId !== lastId);
    const t = tagById(lastId);
    if (t && draft[t.kind]) {
      const arr = draft[t.kind];
      const i = arr.indexOf(lastId);
      if (i >= 0) arr.splice(i, 1);
    }
    renderAll();
    return;
  }
  if (confidence != null) { confidence = null; renderAll(); return; }
  if (memoEl.value) { memoEl.value = ""; renderAll(); return; }
  // draft 비었으면 마지막 기록 삭제
  if (events.length === 0) { toast("취소할 게 없음"); return; }
  if (confirm("마지막 기록 취소?")) {
    events.pop(); saveEvents(events); renderFeed(); toast("마지막 기록 취소됨");
  }
};

document.getElementById("resetBtn").onclick = () => {
  const anyTag = Object.keys(KINDS).some(k => draft[k].length > 0);
  if (!anyTag && confidence == null && !document.getElementById("memoInput").value) {
    toast("이미 비어 있음"); return;
  }
  if (!confirm("현재 입력 중인 것을 전체 비울까요?")) return;
  draft = newDraft();
  confidence = null;
  document.getElementById("memoInput").value = "";
  renderAll();
  toast("초기화됨");
};

document.getElementById("exportBtn").onclick = () => {
  if (events.length === 0) { toast("내보낼 기록 없음"); return; }
  const header = ["id","ts","action","z","x","modifier","entry_q","hold_r","tap_order","confidence","memo"];
  const rows = events.map(ev => [
    ev.id, ev.ts,
    ev.action[0] ? (tagById(ev.action[0])?.name || "") : "",
    ev.z.map(id => tagById(id)?.name || "").join("|"),
    ev.x.map(id => tagById(id)?.name || "").join("|"),
    ev.modifier.map(id => tagById(id)?.name || "").join("|"),
    ev.entry_q.map(id => tagById(id)?.name || "").join("|"),
    ev.hold_r.map(id => tagById(id)?.name || "").join("|"),
    ev.tap_order.map(id => tagById(id)?.name || "").join("→"),
    ev.confidence ?? "",
    (ev.memo || "").replace(/\n/g, " ").replace(/"/g, '""'),
  ]);
  const csv = [header, ...rows].map(r => r.map(c => `"${c}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `checklist_${fmtDate(now())}.csv`; a.click();
  URL.revokeObjectURL(url);
  toast("CSV 내려받음");
};

// ==============================
// 태그 관리 모달
// ==============================
const modal = document.getElementById("modal");
document.getElementById("manageBtn").onclick = openTagManager;
document.getElementById("closeModalBtn").onclick = () => modal.classList.remove("open");
document.getElementById("addTagBtn").onclick = () => {
  const name = prompt("새 태그 이름:");
  if (!name) return;
  const kind = prompt("종류 (" + Object.keys(KINDS).join(" / ") + "):", "z");
  if (!KINDS[kind]) { toast("알 수 없는 종류"); return; }
  tags.push({ id: uid("t"), name: name.trim(), kind, active: true });
  saveTags(tags); openTagManager();
};

function openTagManager() {
  const list = document.getElementById("tagList");
  let html = "";
  for (const [k, info] of Object.entries(KINDS)) {
    html += `<div class="section-title" style="margin-top:8px">${info.label}</div>`;
    const arr = tags.filter(t => t.kind === k);
    if (arr.length === 0) html += `<div class="empty">없음</div>`;
    else html += arr.map(t => `
      <div class="tag-row" data-id="${t.id}">
        <input type="text" value="${t.name}" data-field="name" data-id="${t.id}">
        <select data-field="kind" data-id="${t.id}">
          ${Object.entries(KINDS).map(([kk,v]) => `<option value="${kk}" ${kk===t.kind?'selected':''}>${kk}</option>`).join("")}
        </select>
        <button class="icon-btn" data-action="toggle" data-id="${t.id}">${t.active?'끄기':'켜기'}</button>
        <button class="icon-btn danger" data-action="delete" data-id="${t.id}">삭제</button>
      </div>
    `).join("");
  }
  list.innerHTML = html;

  list.querySelectorAll("input[data-field='name']").forEach(el => {
    el.onchange = () => {
      const t = tagById(el.dataset.id);
      if (t) { t.name = el.value.trim() || t.name; saveTags(tags); }
    };
  });
  list.querySelectorAll("select[data-field='kind']").forEach(el => {
    el.onchange = () => {
      const t = tagById(el.dataset.id);
      if (t) { t.kind = el.value; saveTags(tags); openTagManager(); }
    };
  });
  list.querySelectorAll("button[data-action='toggle']").forEach(el => {
    el.onclick = () => {
      const t = tagById(el.dataset.id);
      if (t) { t.active = !t.active; saveTags(tags); openTagManager(); }
    };
  });
  list.querySelectorAll("button[data-action='delete']").forEach(el => {
    el.onclick = () => {
      if (!confirm("이 태그 영구 삭제? (과거 기록은 ID로 남아 있음)")) return;
      tags = tags.filter(t => t.id !== el.dataset.id);
      saveTags(tags); openTagManager();
    };
  });
  modal.classList.add("open");
}

// 초기 렌더
renderAll();
</script>
</body>
</html>
